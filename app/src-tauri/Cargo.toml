[package]
name = "qingying"
version = "1.0.1"
description = "本地调色与批量输出"
authors = ["清影 Qingying Studio"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "qingying_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
